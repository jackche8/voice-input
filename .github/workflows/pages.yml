name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify static site assets
        run: |
          test -f docs/site/.nojekyll
          test -s docs/site/index.html
          test -s docs/site/styles.css
          test -s docs/site/site.js
          test -s docs/site/assets/workbench-light.png
          test -s docs/site/assets/workbench-dark.png
          test -s docs/site/assets/annotate-icons.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
