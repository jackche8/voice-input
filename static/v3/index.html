<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <script src="js/business/context.js"></script>
  <script>
    if (window.V3Business && typeof window.V3Business.adoptTokenFromLocation === "function") {
      window.V3Business.adoptTokenFromLocation();
    }
  </script>
  <title>Voice Studio · 本地翻译与语音工作台</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/studio.css" />
</head>
<body class="v3-studio">
  <div id="app"></div>

  <script src="js/dom.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/defaults.js"></script>
  <script src="js/confirm.js"></script>
  <script src="js/history.js"></script>
  <script src="js/hotkey-capture.js"></script>
  <script src="js/setup-models.js"></script>
  <script src="js/setup-panel.js"></script>
  <script src="js/ocr-presets.js"></script>
  <script src="js/ocr-panel.js"></script>
  <script src="js/logs-panel.js"></script>
  <script src="js/about-panel.js"></script>
  <script src="js/home.js"></script>
  <script src="js/business/catalog.js"></script>
  <script src="js/business/http.js"></script>
  <script src="js/business/clipboard.js"></script>
  <script src="js/business/map-setup.js"></script>
  <script src="js/business/setup-actions.js"></script>
  <script src="js/business/logs-actions.js"></script>
  <script src="js/business/ocr-actions.js"></script>
  <script src="js/business/home-controller.js"></script>
  <script src="js/business/bootstrap.js" data-page="home"></script>
  <script>
    /* 离线夹具与测试通过 window.__V3_HOOKS__ 注入；仅在业务层明确不启动且尚未挂载时于 DOMContentLoaded 后回退挂载。 */
    (function () {
      function fallbackMountHome() {
        var biz = window.V3Business;
        var offlineOnly = !!(window.__V3_HOOKS__ || !biz || typeof biz.shouldStartBusiness !== "function" || !biz.shouldStartBusiness());
        if (!offlineOnly || window.__v3Home) return;
        if (!window.V3 || !window.V3.home || typeof window.V3.home.mount !== "function") return;
        var appRoot = document.getElementById("app");
        if (appRoot && !appRoot.firstChild) {
          var injectedHooks = window.__V3_HOOKS__ || {};
          var initState = Object.assign({}, injectedHooks.initialState || {});
          var path = (typeof location !== "undefined" && location.pathname) || "";
          var hash = (typeof location !== "undefined" && location.hash) || "";
          if (!initState.activePanel && !initState.panel && (path === "/setup" || path === "/setup/" || hash === "#setup")) {
            initState.activePanel = "setup";
          }
          window.__v3Home = window.V3.home.mount(appRoot, initState, injectedHooks);
        }
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", fallbackMountHome);
      } else {
        setTimeout(fallbackMountHome, 0);
      }
    })();
  </script>
</body>
</html>
